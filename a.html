<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Segoe UI', Roboto, sans-serif;
  background: #f4f6f9;
  color: #333;
  overflow-x: hidden;
}

/* ================= HEADER ================= */

header {
  position: relative;
  background: linear-gradient(270deg, #2e7d32, #1b5e20, #388e3c);
  background-size: 600% 600%;
  animation: gradientAnimation 12s ease infinite;
  color: white;
  padding: 40px 40px;
}

@keyframes gradientAnimation {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.header-container {
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
}

.logo-title {display:flex; align-items:center; gap:15px;}
.logo {width:60px;}
.title h1{font-size:24px;}
.title p{font-size:14px; opacity:0.9;}

/* ================= NAVBAR ================= */

/* ================= PREMIUM NAVBAR (DESKTOP ASLI) ================= */

.navbar { 
  position: relative; 
}

.nav-menu {
  list-style: none;
  display: flex;
  gap: 25px;
  align-items: center;
}

.nav-menu li { 
  position: relative; 
}

.nav-menu a {
  position: relative;
  text-decoration: none;
  color: white;
  font-size: 15px;
  font-weight: 500;
  padding: 8px 0;
  transition: 0.3s ease;
}

/* Underline animation */
.nav-menu a::after {
  content:"";
  position:absolute;
  bottom:-4px;
  left:0;
  width:0%;
  height:2px;
  background:#a5d6a7;
  transition:0.3s;
}

.nav-menu a:hover::after { 
  width:100%; 
}

.nav-menu a.active { 
  color:#c8e6c9; 
}

/* Dropdown icon */
.dropdown-icon {
  margin-left: 0px;
  font-size: 19px;
  transition: transform 0.3s ease;
}

/* Rotate on hover */
.dropdown:hover .dropdown-icon {
  transform: rotate(180deg);
}

/* DROPDOWN MENU (Glass Effect) */

.dropdown-menu {
  position:absolute;
  top:45px;
  left:0;
  min-width:220px;
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(12px);
  border-radius:12px;
  padding:10px 0;
  box-shadow:0 15px 30px rgba(0,0,0,0.15);
  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:0.3s ease;
}

.dropdown-menu li { 
  list-style:none; 
}

.dropdown-menu a {
  color:#1b5e20;
  padding:10px 20px;
  display:block;
}

.dropdown-menu a:hover { 
  background:#f1f8f4; 
}

.dropdown:hover .dropdown-menu {
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}


/* ================= HAMBURGER ================= */

.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
  gap: 6px;
  z-index: 10000;
}

.hamburger span {
  width: 28px;
  height: 3px;
  background: white;
  border-radius: 3px;
  transition: 0.3s ease;
}

.hamburger.active span:nth-child(1) {
  transform: rotate(45deg) translate(6px, 6px);
}

.hamburger.active span:nth-child(2) {
  opacity: 0;
}

.hamburger.active span:nth-child(3) {
  transform: rotate(-45deg) translate(6px, -6px);
}

/* ================= OVERLAY ================= */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  opacity: 0;
  visibility: hidden;
  transition: 0.3s ease;
  z-index: 9000;
}

.overlay.active {
  opacity: 1;
  visibility: visible;
}

/* ================= MAIN ================= */

main {
  padding: 30px 20px;
  background:
    linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)),
    url("https://yogyakartakota.kemenag.go.id/wp-content/uploads/2024/09/Foto-Kantor-Kementerian-Agama-Kota-Yogyakarta-WM.jpeg")
    center/cover fixed no-repeat;
}

.content-wrapper { max-width:1200px; margin:auto; }

.dashboard-card {
  background:white;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  margin-bottom:40px;
  overflow:hidden;
}

.dashboard-header {
  background:#1b5e20;
  color:white;
  padding:16px;
  font-weight:bold;
}

.dashboard-content { padding:20px; }

/* ================= FOOTER ================= */

footer {
  background:#1b5e20;
  color:white;
  padding:20px;
  text-align:center;
  font-size:14px;
}

/* ================= RESPONSIVE ================= */

@media (max-width:768px){

  .hamburger { display:flex; }

  .navbar {
    position:absolute;
    top:100%;
    right:0;
    width:100%;
  }

  .nav-menu {
    flex-direction:column;
    background:rgba(27,94,32,0.98);
    width:100%;
    padding:20px;
    transform: translateY(-20px);
    opacity:0;
    visibility:hidden;
    transition:0.3s ease;
  }

  .nav-menu.active {
    transform: translateY(0);
    opacity:1;
    visibility:visible;
  }

  .dropdown-menu {
    position:relative;
    background:transparent;
    box-shadow:none;
    padding-left:15px;
    display:none;
    opacity:1;
    visibility:visible;
  }

  .dropdown.open .dropdown-menu { display:block; }

  .dropdown-menu a { color:#c8e6c9; }
}

</style>
</head>

<script>
function toggleMenu(){
  const nav=document.getElementById("navMenu");
  const burger=document.querySelector(".hamburger");
  const overlay=document.getElementById("overlay");

  nav.classList.toggle("active");
  burger.classList.toggle("active");
  overlay.classList.toggle("active");
}

function closeMenu(){
  document.getElementById("navMenu").classList.remove("active");
  document.querySelector(".hamburger").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

document.querySelectorAll(".nav-menu a").forEach(link=>{
  link.addEventListener("click",()=>{
    if(window.innerWidth<=768){ closeMenu(); }
  });
});

document.querySelectorAll(".dropdown > a").forEach(item=>{
  item.addEventListener("click",function(e){
    if(window.innerWidth<=768){
      e.preventDefault();
      this.parentElement.classList.toggle("open");
    }
  });
});
</script>
